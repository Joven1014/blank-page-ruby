<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A deliberately simple web search start page." />
    <title>Blank Page</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #000; background: #fff; }
      main { width: min(680px, 100%); transform: translateY(-8vh); }
      h1 { margin: 0 0 34px; text-align: center; font-size: clamp(2.2rem, 7vw, 4.75rem); letter-spacing: -0.065em; font-weight: 700; }
      form { display: flex; gap: 10px; }
      input { min-width: 0; flex: 1; height: 54px; padding: 0 19px; border: 2px solid #000; border-radius: 14px; outline: none; background: #fff; color: inherit; font: inherit; font-size: 1rem; transition: border-color 140ms ease, box-shadow 140ms ease; }
      input::placeholder { color: #555; }
      input:focus { border-color: #000; box-shadow: 0 0 0 4px #000; }
      button { height: 54px; padding: 0 20px; border: 0; border-radius: 14px; background: #000; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
      button:hover { background: #fff; color: #000; border: 2px solid #000; }
      .hint { margin: 14px 2px 0; text-align: center; color: #000; font-size: .85rem; }
      kbd { padding: 1px 5px; border: 1px solid #000; border-radius: 4px; color: #000; font: inherit; font-size: .78rem; }
      @media (max-width: 490px) { form { gap: 7px; } button { padding: 0 15px; } }
    </style>
  </head>
  <body>
    <main>
      <h1>Blank Page</h1>
      <form id="search-form" role="search">
        <input id="query" type="search" autocomplete="off" autofocus placeholder="Search the web or enter a URL" aria-label="Search the web or enter a URL" />
        <button type="submit">Search</button>
      </form>
      <p class="hint">Press <kbd>Enter</kbd> to search. URLs open directly.</p>
    </main>
    <script>
      const form = document.querySelector('#search-form');
      const query = document.querySelector('#query');
      function destination(value) {
        const text = value.trim();
        if (!text) return null;
        const looksLikeUrl = /^(https?:\/\/|localhost(?::\d+)?(?:\/|$)|(?:[\w-]+\.)+[a-z]{2,}(?:\/|$))/i.test(text);
        if (looksLikeUrl) return /^https?:\/\//i.test(text) ? text : `https://${text}`;
        return `https://www.google.com/search?q=${encodeURIComponent(text)}`;
      }
      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const url = destination(query.value);
        if (url) window.location.assign(url);
      });
    </script>
  </body>
</html>
